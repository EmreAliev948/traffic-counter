# Traffic counter v3 - configuration
#
# Line coordinates are in pixels of the stream's native resolution.
# Get them with:  python -m tools.calibrate <camera_id>
#
# Direction: imagine standing on the line's first point looking towards the second.
#   "in"  = the object moves from your LEFT side to your RIGHT side
#   "out" = the object moves from your RIGHT side to your LEFT side
# (For a horizontal line drawn left -> right, "in" means moving DOWN the image.)
#
# Public streams can move or disappear. Status checked on 2026-10-15:
#   working: 2, 4, 5, 6, 7, 8, 9, 11    offline: 3, 10, 12 (YouTube says "not available")
# Check each source's terms of use before long-running use.

defaults:
  model: yolo26n.pt           # downloaded by ultralytics on first use
  fallback_model: yolo11n.pt  # used if the main model cannot be loaded
  conf: 0.1                   # low on purpose: ByteTrack stage 2 needs boxes scoring 0.1-0.25 (see worker.py)
  imgsz: 640
  vid_stride: 2               # analyse every 2nd frame (25 fps stream -> 12.5 frames/s)
  classes: [0, 1, 2, 3, 5, 7] # COCO: person, bicycle, car, motorcycle, bus, truck
  db_path: data/traffic.db    # relative to this file
  timezone: Europe/Sofia      # dashboard display only; the database is always UTC

cameras:
  - id: "2"
    name: Ruse - checkpoint (KPP)
    url: http://s19.r145.nbis.net:8081/or-bul-cam4/index.m3u8
    enabled: true
    line: [[60, 420], [1000, 420]]

