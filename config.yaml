# Traffic counter v3 - configuration
#
# Line coordinates are in pixels of the stream's native resolution.
# Get them with:  python -m tools.calibrate <camera_id>
#
# Direction: imagine standing on the line's first point looking towards the second.
#   "in"  = the object moves from your LEFT side to your RIGHT side
#   "out" = the object moves from your RIGHT side to your LEFT side
# (For a horizontal line drawn left -> right, "in" means moving DOWN the image.)
#
# url must be a direct stream (HLS .m3u8 or rtsp://). Public streams can move or disappear.
# Check each source's terms of use before long-running use.

defaults:
  model: yolo26n.pt           # downloaded by ultralytics on first use
  fallback_model: yolo11n.pt  # used if the main model cannot be loaded
  conf: 0.1                   # low on purpose: ByteTrack stage 2 needs boxes scoring 0.1-0.25 (see worker.py)
  backend: openvino           # pytorch | onnx | openvino. Exported once at start-up; on the AMD EPYC server openvino is 1.85x faster than pytorch
  imgsz: [384, 640]           # [height, width] the model sees. 16:9 frames need no padding at this size
  vid_stride: auto            # auto = analyse as many frames as the CPU allows without falling behind; or a fixed number (3 = every 3rd frame)
  pin_cores: true             # Linux: give each camera its own physical CPU core(s); +22 % frames on the server
  line_margin_px: 6           # a crossing counts only once the box bottom is this many pixels past the line
  classes: [0, 1, 2, 3, 5, 7] # COCO: person, bicycle, car, motorcycle, bus, truck
  db_path: data/traffic.db    # relative to this file
  timezone: Europe/Sofia      # reports only; the database is always UTC

cameras:
  - id: "1"
    name: Ruse - checkpoint (KPP)
    url: http://s19.r145.nbis.net:8081/or-bul-cam4/index.m3u8
    enabled: true
    line: [[60, 420], [1000, 420]]

  - id: "2"
    name: Tutrakan - main road
    url: http://s19.r145.nbis.net:8081/or-bul-cam1/index.m3u8
    enabled: true
    line: [[1164, 261], [320, 163]]

  - id: "3"
    name: Ruse - Silistra road
    url: http://s19.r145.nbis.net:8081/or-bul-cam2/index.m3u8
    enabled: true
    line: [[1190, 580], [244, 227]]
    
  - id: "4"
    name: Or-Bul cam 3 - dual carriageway
    url: http://s19.r145.nbis.net:8081/or-bul-cam3/index.m3u8
    enabled: true
    line: [[1263, 417], [481, 196]]

